name: Publish Fabric releases

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Publish all Fabric variants
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: >-
          gradle publishFabricAll
          -PenablePublishing=true
          -PmodrinthFabricProjectId=${{ vars.MODRINTH_FABRIC_PROJECT_ID }}
          -PcurseforgeFabricProjectId=${{ vars.CURSEFORGE_FABRIC_PROJECT_ID }}
          --stacktrace
