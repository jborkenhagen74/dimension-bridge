name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build all supported versions
        run: gradle clean collectReleaseArtifacts --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dimensionbridge-all
          path: build/releases/*.jar
