org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.configuration-cache=false
org.gradle.caching=true

# Build dependencies
fabric_loader_version=0.19.3

# Exact known versions are pinned. Other targets select the newest Fabric API
# artifact whose Maven version ends with +<minecraft-version>.
fabric_api_1_20_1=0.92.11+1.20.1
fabric_api_1_21_11=0.141.5+1.21.11
fabric_api_26_1_2=0.155.2+26.1.2
fabric_api_26_2=0.155.2+26.2

# Publishing is opt-in. See publishing.properties.example and README.md.
enablePublishing=false
