plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.16'
    id 'maven-publish'
}

base {
    archivesName = 'dimensionbridge-fabric-26.2'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    // Minecraft 26.1+ is unobfuscated. The non-remapping Loom plugin uses
    // Gradle's standard implementation configuration instead of modImplementation.
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.155.2+26.2'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
